<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horus AIS — Souveraineté. Contrôle. Confiance.</title>
  <meta name="description" content="Horus AIS — Infrastructure de défense personnelle. Lab cybersécurité documenté." />
  <style>
    :root {
      --gold: #d4af37;
      --gold-soft: #c9a227;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --bg: #050505;
      --text: #e8e0d0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #0f0d08 0%, #050505 70%);
    }

    /* ===== Hero ===== */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 920px;
      width: 100%;
    }

    .logo-wrap {
      position: relative;
      width: min(720px, 92vw);
      margin-bottom: 1.75rem;
      cursor: pointer;
      user-select: none;
      isolation: isolate; /* crée un contexte d'empilement propre */
    }

    .logo-wrap img {
      position: relative;
      z-index: 1;              /* image en arrière-plan */
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
      filter: drop-shadow(0 0 28px rgba(212, 175, 55, 0.18));
      transition: filter 0.4s ease;
      pointer-events: none;   /* laisse les événements souris au conteneur */
    }

    .logo-wrap:hover img {
      filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.35));
    }

    /* Canvas particles — DOIT être au-dessus de l'image */
    #dust-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;             /* clairement au-dessus */
    }

    .tagline {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin-bottom: 2.4rem;
      opacity: 0.92;
      text-shadow: 0 0 24px var(--gold-glow);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a89f8c;
      max-width: 420px;
      line-height: 1.55;
      margin-bottom: 2.6rem;
      font-weight: 300;
    }

    /* ===== Buttons ===== */
    .actions {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 1.7rem;
      border: 1px solid rgba(212, 175, 55, 0.45);
      background: transparent;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(212, 175, 55, 0.12), transparent);
      transform: translateX(-100%);
      transition: transform 0.45s ease;
    }

    .btn:hover {
      background: rgba(212, 175, 55, 0.08);
      border-color: var(--gold);
      box-shadow: 0 0 22px rgba(212, 175, 55, 0.25);
    }

    .btn:hover::before {
      transform: translateX(100%);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ===== Footer ===== */
    footer {
      position: absolute;
      bottom: 1.4rem;
      font-size: 0.72rem;
      color: #5a5348;
      letter-spacing: 0.08em;
    }

    /* Mobile */
    @media (max-width: 520px) {
      .tagline {
        letter-spacing: 0.18em;
      }
      .btn {
        padding: 0.75rem 1.3rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <main class="hero">
    <div class="logo-wrap" id="logo-wrap">
      <!-- Place ton image ici (renomme-la horus-ais.png ou change le src) -->
      <img src="horus-ais.png" alt="Horus AIS" id="logo-img" />
      <canvas id="dust-canvas"></canvas>
    </div>

    <p class="tagline">Souveraineté. Contrôle. Confiance.</p>

    <p class="subtitle">
      Cliquez sur le pavé pour entrer.
    </p>

    <div class="actions">
      <a class="btn" href="/liens">Entrer</a>
      <a class="btn" href="/contact">Contact</a>
      <a class="btn" href="https://www.linkedin.com/in/ludovic-suy-denis-a93569210/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
    </div>
  </main>

  <footer>Horus AIS · Lab cybersécurité</footer>

  <script>
    /* ============================================================
       Dust particles — golden hieroglyphs + Matrix symbols
       Hover / move over the logo → blow a cloud of sacred dust
       ============================================================ */
    (function () {
      const wrap = document.getElementById("logo-wrap");
      const canvas = document.getElementById("dust-canvas");
      const ctx = canvas.getContext("2d");

      // Characters pool — enrichi
      const hieroglyphs = [
        "𓂀", "𓋹", "𓆣", "𓁹", "𓃀", "𓏏", "𓊃", "𓈖", "𓇋", "𓎛",
        "𓄿", "𓍯", "𓃭", "𓆑", "𓅓", "𓏲", "𓊪", "𓂋", "𓏤", "𓇳",
        "𓊨", "𓁶", "𓃂", "𓆓", "𓋴", "𓈎", "𓍿", "𓄡", "𓏥", "𓊖"
      ];
      const matrix = [
        "ア", "カ", "サ", "タ", "ナ", "ハ", "マ", "ヤ", "ラ", "ワ",
        "イ", "キ", "シ", "チ", "ニ", "ヒ", "ミ", "リ", "ウ", "ク",
        "ス", "ツ", "ヌ", "フ", "ム", "ユ", "ル", "エ", "ケ", "セ",
        "0", "1", "7", "ゼ", "ク", "ゾ", "ダ", "バ", "パ", "ン",
        "Σ", "Ω", "Δ", "Ψ", "λ", "μ", "π", "τ"
      ];
      const allChars = [...hieroglyphs, ...matrix];

      let particles = [];
      let animId = null;
      let isHovering = false;
      let lastSpawn = 0;

      function resize() {
        const rect = wrap.getBoundingClientRect();
        // Évite les tailles nulles si l'image n'est pas encore chargée
        if (rect.width < 10 || rect.height < 10) return;
        canvas.width = Math.floor(rect.width * devicePixelRatio);
        canvas.height = Math.floor(rect.height * devicePixelRatio);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      // mode = "soft" (hover) ou "burst" (clic / explosion)
      function spawn(x, y, count = 8, mode = "soft") {
        const isBurst = mode === "burst";
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = isBurst
            ? 2.5 + Math.random() * 4.5
            : 1.0 + Math.random() * 2.2;

          particles.push({
            x: x + (Math.random() - 0.5) * (isBurst ? 30 : 50),
            y: y + (Math.random() - 0.5) * (isBurst ? 20 : 30),
            vx: isBurst ? Math.cos(angle) * speed : (Math.random() - 0.5) * 2.2,
            vy: isBurst ? Math.sin(angle) * speed - 1.5 : -1.4 - Math.random() * 2.8,
            life: 1,
            decay: isBurst
              ? 0.014 + Math.random() * 0.018
              : 0.010 + Math.random() * 0.016,
            size: isBurst
              ? 14 + Math.random() * 14
              : 13 + Math.random() * 11,
            char: allChars[Math.floor(Math.random() * allChars.length)],
            rot: (Math.random() - 0.5) * 0.6,
            rotSpeed: (Math.random() - 0.5) * (isBurst ? 0.14 : 0.08)
          });
        }
      }

      function tick(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Continuous light spawn while hovering
        if (isHovering && now - lastSpawn > 70) {
          const rect = wrap.getBoundingClientRect();
          spawn(rect.width * (0.3 + Math.random() * 0.4), rect.height * (0.35 + Math.random() * 0.3), 2);
          lastSpawn = now;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy -= 0.015;          // slight upward acceleration
          p.vx *= 0.99;
          p.life -= p.decay;
          p.rot += p.rotSpeed;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.font = `${p.size}px "Segoe UI Symbol", "Noto Sans Egyptian Hieroglyphs", serif`;
          ctx.fillStyle = "#d4af37";
          ctx.shadowColor = "rgba(212, 175, 55, 0.7)";
          ctx.shadowBlur = 8;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(p.char, 0, 0);
          ctx.restore();
        }

        if (particles.length > 0 || isHovering) {
          animId = requestAnimationFrame(tick);
        } else {
          animId = null;
        }
      }

      function startLoop() {
        if (!animId) animId = requestAnimationFrame(tick);
      }

      // Events — hover (souffle doux)
      wrap.addEventListener("mouseenter", (e) => {
        isHovering = true;
        const rect = wrap.getBoundingClientRect();
        spawn(e.clientX - rect.left, e.clientY - rect.top, 14, "soft");
        startLoop();
      });

      wrap.addEventListener("mousemove", (e) => {
        if (!isHovering) return;
        const now = performance.now();
        if (now - lastSpawn > 45) {
          const rect = wrap.getBoundingClientRect();
          spawn(e.clientX - rect.left, e.clientY - rect.top, 3, "soft");
          lastSpawn = now;
          startLoop();
        }
      });

      wrap.addEventListener("mouseleave", () => {
        isHovering = false;
      });

      // Clic → explosion puis entrée dans le site
      wrap.addEventListener("click", (e) => {
        const rect = wrap.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        spawn(x, y, 38, "burst");
        setTimeout(() => spawn(x, y, 12, "burst"), 60);
        startLoop();
        setTimeout(function () { window.location.href = "/liens"; }, 480);
      });

      // Touch support (mobile)
      wrap.addEventListener("touchstart", (e) => {
        isHovering = true;
        const rect = wrap.getBoundingClientRect();
        const t = e.touches[0];
        spawn(t.clientX - rect.left, t.clientY - rect.top, 12, "soft");
        startLoop();
      }, { passive: true });

      wrap.addEventListener("touchend", () => {
        isHovering = false;
      });

      window.addEventListener("resize", resize);

      // Image handling — resize après chargement pour que le canvas
      // ait exactement la même taille que l'image
      const img = document.getElementById("logo-img");

      function onImageReady() {
        resize();
      }

      if (img.complete && img.naturalWidth > 0) {
        onImageReady();
      } else {
        img.addEventListener("load", onImageReady);
      }

      // Fallback si l'image est introuvable
      img.onerror = () => {
        img.style.display = "none";
        const placeholder = document.createElement("div");
        placeholder.style.cssText = `
          width: 100%; aspect-ratio: 16/9; background: #0a0a0a;
          border: 1px solid rgba(212,175,55,0.25); display:flex;
          align-items:center; justify-content:center; color:#d4af37;
          font-size:1.4rem; letter-spacing:0.25em;
        `;
        placeholder.textContent = "HORUS AIS";
        wrap.insertBefore(placeholder, canvas);
        resize();
      };

      // Premier resize de sécurité
      setTimeout(resize, 100);
    })();
  </script>
</body>
</html>
