<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horus AIS — Souveraineté. Contrôle. Confiance.</title>
  <meta name="description" content="Horus AIS — Infrastructure de défense personnelle. Lab cybersécurité documenté." />
  <style>
    :root {
      --gold: #d4af37;
      --gold-soft: #c9a227;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --bg: #050505;
      --text: #e8e0d0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #0f0d08 0%, #050505 70%);
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 920px;
      width: 100%;
    }

    .logo-wrap {
      position: relative;
      width: min(720px, 92vw);
      margin-bottom: 1.75rem;
      cursor: default;
      user-select: none;
      isolation: isolate;
    }

    .logo-wrap img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
      filter: drop-shadow(0 0 28px rgba(212, 175, 55, 0.18));
      transition: filter 0.4s ease;
      pointer-events: none;
    }

    .logo-wrap:hover img {
      filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.35));
    }

    #dust-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .tagline {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin-bottom: 2.4rem;
      opacity: 0.92;
      text-shadow: 0 0 24px var(--gold-glow);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a89f8c;
      max-width: 420px;
      line-height: 1.55;
      margin-bottom: 2.6rem;
      font-weight: 300;
    }

    .actions {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 1.7rem;
      border: 1px solid rgba(212, 175, 55, 0.45);
      background: transparent;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(212, 175, 55, 0.12), transparent);
      transform: translateX(-100%);
      transition: transform 0.45s ease;
    }

    .btn:hover {
      background: rgba(212, 175, 55, 0.08);
      border-color: var(--gold);
      box-shadow: 0 0 22px rgba(212, 175, 55, 0.25);
    }

    .btn:hover::before {
      transform: translateX(100%);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    footer {
      position: absolute;
      bottom: 1.4rem;
      font-size: 0.72rem;
      color: #5a5348;
      letter-spacing: 0.08em;
    }

    @media (max-width: 520px) {
      .tagline {
        letter-spacing: 0.18em;
      }
      .btn {
        padding: 0.75rem 1.3rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <main class="hero">
    <div class="logo-wrap" id="logo-wrap">
      <img src="assets/face_web.jpg" alt="Horus AIS" id="logo-img" />
      <canvas id="dust-canvas"></canvas>
    </div>

    <p class="tagline">Souveraineté. Contrôle. Confiance.</p>

    <p class="subtitle">
      Infrastructure de défense personnelle.<br />
      Lab cybersécurité documenté.
    </p>

    <div class="actions">
      <a class="btn" href="https://github.com/Lu-Suy/Opnsense-homelab-security" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.123-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.3 1.23.96-.267 1.98-.4 3-.405 1.02.005 2.04.138 3 .405 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.12 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.805 5.625-5.475 5.92.43.37.81 1.1.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .32.216.694.825.576C20.565 21.796 24 17.297 24 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>

      <a class="btn" href="https://www.linkedin.com/in/ludovic-suy-denis-a93569210/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
    </div>
  </main>

  <footer>Horus AIS · Lab cybersécurité</footer>

  <script>
    (function () {
      const wrap = document.getElementById("logo-wrap");
      const canvas = document.getElementById("dust-canvas");
      const ctx = canvas.getContext("2d");

      const hieroglyphs = [
        "\ud83c\udc80", "\ud83c\udc79", "\ud83c\udc23", "\ud83c\udc79", "\ud83c\udc00", "\ud83c\udc4f", "\ud83c\udc03", "\ud83c\udc16", "\ud83c\udc4b", "\ud83c\udc5b",
        "\ud83c\udc3f", "\ud83c\udc6f", "\ud83c\udc2d", "\ud83c\udc11", "\ud83c\udc13", "\ud83c\udc72", "\ud83c\udc2a", "\ud83c\udc0b", "\ud83c\udc64", "\ud83c\udc33",
        "\ud83c\udc28", "\ud83c\udc76", "\ud83c\udc02", "\ud83c\udc13", "\ud83c\udc74", "\ud83c\udc0e", "\ud83c\udc5f", "\ud83c\udc21", "\ud83c\udc65", "\ud83c\udc16"
      ];
      const matrix = [
        "\u30a2", "\u30ab", "\u30b5", "\u30bf", "\u30ca", "\u30cf", "\u30de", "\u30e4", "\u30e9", "\u30ef",
        "\u30a4", "\u30ad", "\u30b7", "\u30c1", "\u30cb", "\u30d2", "\u30df", "\u30ea", "\u30a6", "\u30af",
        "\u30b9", "\u30c4", "\u30cc", "\u30d5", "\u30e0", "\u30e6", "\u30eb", "\u30a8", "\u30b1", "\u30bb",
        "0", "1", "7", "\u30bc", "\u30af", "\u30be", "\u30c0", "\u30d0", "\u30d1", "\u30f3",
        "\u03a3", "\u03a9", "\u0394", "\u03a8", "\u03bb", "\u03bc", "\u03c0", "\u03c4"
      ];
      const allChars = [...hieroglyphs, ...matrix];

      let particles = [];
      let animId = null;
      let isHovering = false;
      let lastSpawn = 0;

      function resize() {
        const rect = wrap.getBoundingClientRect();
        if (rect.width < 10 || rect.height < 10) return;
        canvas.width = Math.floor(rect.width * devicePixelRatio);
        canvas.height = Math.floor(rect.height * devicePixelRatio);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      function spawn(x, y, count = 8, mode = "soft") {
        const isBurst = mode === "burst";
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = isBurst
            ? 2.5 + Math.random() * 4.5
            : 1.0 + Math.random() * 2.2;

          particles.push({
            x: x + (Math.random() - 0.5) * (isBurst ? 30 : 50),
            y: y + (Math.random() - 0.5) * (isBurst ? 20 : 30),
            vx: isBurst ? Math.cos(angle) * speed : (Math.random() - 0.5) * 2.2,
            vy: isBurst ? Math.sin(angle) * speed - 1.5 : -1.4 - Math.random() * 2.8,
            life: 1,
            decay: isBurst
              ? 0.014 + Math.random() * 0.018
              : 0.010 + Math.random() * 0.016,
            size: isBurst
              ? 14 + Math.random() * 14
              : 13 + Math.random() * 11,
            char: allChars[Math.floor(Math.random() * allChars.length)],
            rot: (Math.random() - 0.5) * 0.6,
            rotSpeed: (Math.random() - 0.5) * (isBurst ? 0.14 : 0.08)
          });
        }
      }

      function tick(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (isHovering && now - lastSpawn > 70) {
          const rect = wrap.getBoundingClientRect();
          spawn(rect.width * (0.3 + Math.random() * 0.4), rect.height * (0.35 + Math.random() * 0.3), 2);
          lastSpawn = now;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy -= 0.015;
          p.vx *= 0.99;
          p.life -= p.decay;
          p.rot += p.rotSpeed;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.font = `${p.size}px "Segoe UI Symbol", "Noto Sans Egyptian Hieroglyphs", serif`;
          ctx.fillStyle = "#d4af37";
          ctx.shadowColor = "rgba(212, 175, 55, 0.7)";
          ctx.shadowBlur = 8;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(p.char, 0, 0);
          ctx.restore();
        }

        if (particles.length > 0 || isHovering) {
          animId = requestAnimationFrame(tick);
        } else {
          animId = null;
        }
      }

      function startLoop() {
        if (!animId) animId = requestAnimationFrame(tick);
      }

      wrap.addEventListener("mouseenter", (e) => {
        isHovering = true;
        const rect = wrap.getBoundingClientRect();
        spawn(e.clientX - rect.left, e.clientY - rect.top, 14, "soft");
        startLoop();
      });

      wrap.addEventListener("mousemove", (e) => {
        if (!isHovering) return;
        const now = performance.now();
        if (now - lastSpawn > 45) {
          const rect = wrap.getBoundingClientRect();
          spawn(e.clientX - rect.left, e.clientY - rect.top, 3, "soft");
          lastSpawn = now;
          startLoop();
        }
      });

      wrap.addEventListener("mouseleave", () => {
        isHovering = false;
      });

      wrap.addEventListener("click", (e) => {
        const rect = wrap.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        spawn(x, y, 38, "burst");
        setTimeout(() => spawn(x, y, 12, "burst"), 60);
        startLoop();
      });

      wrap.addEventListener("touchstart", (e) => {
        isHovering = true;
        const rect = wrap.getBoundingClientRect();
        const t = e.touches[0];
        spawn(t.clientX - rect.left, t.clientY - rect.top, 12, "soft");
        startLoop();
      }, { passive: true });

      wrap.addEventListener("touchend", () => {
        isHovering = false;
      });

      window.addEventListener("resize", resize);

      const img = document.getElementById("logo-img");

      function onImageReady() {
        resize();
      }

      if (img.complete && img.naturalWidth > 0) {
        onImageReady();
      } else {
        img.addEventListener("load", onImageReady);
      }

      img.onerror = () => {
        img.style.display = "none";
        const placeholder = document.createElement("div");
        placeholder.style.cssText = `
          width: 100%; aspect-ratio: 16/9; background: #0a0a0a;
          border: 1px solid rgba(212,175,55,0.25); display:flex;
          align-items:center; justify-content:center; color:#d4af37;
          font-size:1.4rem; letter-spacing:0.25em;
        `;
        placeholder.textContent = "HORUS AIS";
        wrap.insertBefore(placeholder, canvas);
        resize();
      };

      setTimeout(resize, 100);
    })();
  </script>
</body>
</html>
